<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf7f2">
<title>2048</title>
<style>
  :root {
    --bg: #faf7f2;
    --board-bg: #c9b8a0;
    --cell-bg: #d9cbbc;
    --text: #776e65;
    --text-light: #9a8f83;
    --btn: #8f7a66;
    --btn-light: #b5a48f;
    --gap: 10px;
    --board-size: min(92vw, 460px);
    --cell: calc((var(--board-size) - 5 * var(--gap)) / 4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: radial-gradient(circle at 50% 30%, #fdfbf7 0%, var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", "Noto Sans SC", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    display: flex;
    justify-content: center;
  }

  .wrap {
    width: min(94vw, 500px);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: calc(16px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom));
  }

  /* ---------- 顶部 ---------- */
  .row-1 {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 2px 10px;
  }

  h1 {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    color: var(--text);
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 6px;
  }

  .scores { display: flex; gap: 8px; }

  .score-box {
    background: var(--board-bg);
    border-radius: 8px;
    padding: 6px 14px 8px;
    min-width: 74px;
    text-align: center;
    display: flex;
    flex-direction: column;
  }

  .score-box .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #f0e6d8;
  }

  .score-box .value {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
  }

  .value.bump { animation: bump .28s ease; }
  @keyframes bump { 50% { transform: scale(1.28); } }

  .row-2 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2px 14px;
  }

  .hint { font-size: 13px; color: var(--text-light); }

  .btns { display: flex; gap: 8px; }

  .btn {
    border: none;
    border-radius: 8px;
    background: var(--btn);
    color: #f9f6f2;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    padding: 10px 16px;
    cursor: pointer;
    transition: transform .08s ease, opacity .15s ease;
  }

  .btn:active { transform: scale(.95); }

  .btn.light { background: var(--btn-light); }

  .btn:disabled {
    opacity: .4;
    cursor: default;
  }

  .btn:disabled:active { transform: none; }

  /* ---------- 棋盘 ---------- */
  .board-wrap {
    display: flex;
    justify-content: center;
  }

  #board {
    position: relative;
    width: var(--board-size);
    height: var(--board-size);
    background: var(--board-bg);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(120, 100, 80, .14);
    touch-action: none;
  }

  .cells {
    position: absolute;
    inset: 0;
  }

  .cell {
    position: absolute;
    width: var(--cell);
    height: var(--cell);
    border-radius: 8px;
    background: var(--cell-bg);
    left: calc(var(--gap) + (var(--cell) + var(--gap)) * var(--cx));
    top: calc(var(--gap) + (var(--cell) + var(--gap)) * var(--cy));
  }

  #tileLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .tile {
    position: absolute;
    width: var(--cell);
    height: var(--cell);
    left: var(--gap);
    top: var(--gap);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    z-index: 1;
    transform: translate(
      calc((var(--cell) + var(--gap)) * var(--tx)),
      calc((var(--cell) + var(--gap)) * var(--ty))
    );
    transition: transform 110ms ease-in-out;
  }

  .tile.new { animation: appear 150ms 90ms ease backwards; }
  @keyframes appear {
    from { scale: 0; opacity: 0; }
    to   { scale: 1; opacity: 1; }
  }

  .tile.merged { z-index: 2; animation: pop 190ms 100ms ease; }
  @keyframes pop {
    0%   { scale: 1; }
    50%  { scale: 1.18; }
    100% { scale: 1; }
  }

  /* 字号（按位数） */
  .tile.s-1 { font-size: calc(var(--cell) * .44); }
  .tile.s-2 { font-size: calc(var(--cell) * .36); }
  .tile.s-3 { font-size: calc(var(--cell) * .28); }
  .tile.s-4 { font-size: calc(var(--cell) * .22); }

  /* 颜色 */
  .tile.v-2    { background: #f0e6d8; color: var(--text); }
  .tile.v-4    { background: #ece0c6; color: var(--text); }
  .tile.v-8    { background: #f3b47a; color: #fff; }
  .tile.v-16   { background: #f29760; color: #fff; }
  .tile.v-32   { background: #f07c58; color: #fff; }
  .tile.v-64   { background: #ee5f3d; color: #fff; }
  .tile.v-128  { background: #eccd6f; color: #fff; box-shadow: 0 0 24px rgba(238, 205, 110, .45); }
  .tile.v-256  { background: #ebc95f; color: #fff; box-shadow: 0 0 26px rgba(235, 201, 95, .5); }
  .tile.v-512  { background: #eac44e; color: #fff; box-shadow: 0 0 28px rgba(234, 196, 78, .5); }
  .tile.v-1024 { background: #e8bf3d; color: #fff; box-shadow: 0 0 30px rgba(232, 191, 61, .55); }
  .tile.v-2048 { background: #e7ba30; color: #fff; box-shadow: 0 0 34px rgba(231, 186, 48, .6); }
  .tile.v-super{ background: #4a443c; color: #fff; box-shadow: 0 0 34px rgba(74, 68, 60, .5); }

  /* 飘分 */
  .float-score {
    position: absolute;
    left: calc(var(--gap) + (var(--cell) + var(--gap)) * var(--tx) + var(--cell) / 2);
    top: calc(var(--gap) + (var(--cell) + var(--gap)) * var(--ty) + var(--cell) * .28);
    transform: translate(-50%, 0);
    font-size: 24px;
    font-weight: 900;
    color: var(--text);
    z-index: 3;
    pointer-events: none;
    animation: floatUp .7s ease-out forwards;
  }
  @keyframes floatUp {
    to { transform: translate(-50%, -44px); opacity: 0; }
  }

  /* ---------- 覆盖层 ---------- */
  #overlay {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: rgba(250, 247, 242, .78);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
    z-index: 5;
  }

  #overlay.show { opacity: 1; pointer-events: auto; }

  #overlayTitle {
    font-size: 36px;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -1px;
  }

  #overlayScore {
    font-size: 16px;
    color: var(--text-light);
    margin-bottom: 14px;
  }

  .overlay-btns {
    display: flex;
    gap: 10px;
  }

  .overlay-btns .btn { padding: 12px 22px; font-size: 16px; }

  /* ---------- 底部 ---------- */
  .foot {
    text-align: center;
    font-size: 12px;
    color: var(--text-light);
    padding: 16px 10px 0;
  }

  @media (max-height: 640px) {
    h1 { font-size: 36px; }
    .row-2 { padding-bottom: 10px; }
    .foot { padding-top: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row-1">
      <div>
        <h1>2048</h1>
        <p class="subtitle">合并相同的数字</p>
      </div>
      <div class="scores">
        <div class="score-box">
          <span class="label">分数</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="label">最高分</span>
          <span class="value" id="best">0</span>
        </div>
      </div>
    </div>
    <div class="row-2">
      <p class="hint">滑动屏幕或用方向键操作</p>
      <div class="btns">
        <button id="undoBtn" class="btn light" disabled>撤销</button>
        <button id="newBtn" class="btn">新游戏</button>
      </div>
    </div>
  </header>

  <div class="board-wrap">
    <div id="board">
      <div class="cells" id="cells"></div>
      <div id="tileLayer"></div>
      <div id="overlay">
        <h2 id="overlayTitle"></h2>
        <p id="overlayScore"></p>
        <div class="overlay-btns">
          <button id="overlayContinue" class="btn light">继续挑战</button>
          <button id="overlayRestart" class="btn">再来一局</button>
        </div>
      </div>
    </div>
  </div>

  <p class="foot">合并到 <b>2048</b> 获胜 · 撤销可以后悔一步</p>
</div>

<script>
(function () {
  'use strict';

  var SIZE = 4;
  var VECTORS = {
    up:    { x: 0, y: -1 },
    down:  { x: 0, y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1, y: 0 }
  };

  var grid;          // grid[y][x] -> tile 或 null
  var tiles;         // id -> tile
  var tileId = 0;
  var score = 0;
  var best = 0;
  var won = false;   // 是否达成过 2048
  var gameOver = false;
  var undoState = null;
  var lock = false;
  var lockTimer = null;
  var winPending = false;
  var pendingRemovals = [];

  var tileLayer = document.getElementById('tileLayer');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var undoBtn = document.getElementById('undoBtn');
  var newBtn = document.getElementById('newBtn');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlayScore = document.getElementById('overlayScore');
  var overlayContinue = document.getElementById('overlayContinue');
  var overlayRestart = document.getElementById('overlayRestart');

  /* ---------- 工具 ---------- */

  function storageGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function storageSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }

  function colorClass(v) { return v <= 2048 ? 'v-' + v : 'v-super'; }

  function sizeClass(v) {
    var len = String(v).length;
    if (len <= 2) return 's-1';
    if (len === 3) return 's-2';
    if (len === 4) return 's-3';
    return 's-4';
  }

  function setPos(el, x, y) {
    el.style.setProperty('--tx', x);
    el.style.setProperty('--ty', y);
  }

  /* ---------- 棋盘 ---------- */

  (function buildCells() {
    var cells = document.getElementById('cells');
    var frag = document.createDocumentFragment();
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        var c = document.createElement('div');
        c.className = 'cell';
        c.style.setProperty('--cx', x);
        c.style.setProperty('--cy', y);
        frag.appendChild(c);
      }
    }
    cells.appendChild(frag);
  })();

  function createTile(x, y, value, opts) {
    opts = opts || {};
    var tile = { id: ++tileId, x: x, y: y, value: value };
    tiles.set(tile.id, tile);
    grid[y][x] = tile;

    var el = document.createElement('div');
    el.className = 'tile ' + colorClass(value) + ' ' + sizeClass(value)
      + (opts.pop ? ' merged' : (opts.silent ? '' : ' new'));
    el.textContent = value;
    setPos(el, x, y);
    tileLayer.appendChild(el);
    tile.el = el;
    return tile;
  }

  // 从数据中删除（DOM 延迟到本轮动画结束后统一移除）
  function removeTile(tile) {
    tiles.delete(tile.id);
    pendingRemovals.push(tile.el);
  }

  function flushRemovals() {
    pendingRemovals.forEach(function (el) { el.remove(); });
    pendingRemovals = [];
  }

  function spawnTile() {
    var empties = [];
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        if (!grid[y][x]) empties.push([x, y]);
      }
    }
    if (!empties.length) return;
    var spot = empties[Math.floor(Math.random() * empties.length)];
    createTile(spot[0], spot[1], Math.random() < 0.9 ? 2 : 4);
  }

  /* ---------- 分数 ---------- */

  function bumpEl(el) {
    el.classList.remove('bump');
    void el.offsetWidth; // 强制重排以重启动画
    el.classList.add('bump');
  }

  function updateScore(gained) {
    scoreEl.textContent = score;
    if (gained) bumpEl(scoreEl);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      bumpEl(bestEl);
      storageSet('game2048-best', String(best));
    }
  }

  /* ---------- 覆盖层 ---------- */

  function hideOverlay() { overlay.classList.remove('show'); }

  function showOverlay(title, showContinue) {
    overlayTitle.textContent = title;
    overlayScore.textContent = '本局分数 ' + score;
    overlayContinue.style.display = showContinue ? '' : 'none';
    overlay.classList.add('show');
  }

  function showWin() { showOverlay('达成 2048！', true); }
  function showLose() { showOverlay('游戏结束', false); }

  /* ---------- 移动逻辑 ---------- */

  function saveSnapshot() {
    return {
      score: score,
      cells: grid.map(function (row) {
        return row.map(function (t) { return t ? t.value : 0; });
      })
    };
  }

  function canMove() {
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        var t = grid[y][x];
        if (!t) return true;
        if (x < SIZE - 1 && grid[y][x + 1] && grid[y][x + 1].value === t.value) return true;
        if (y < SIZE - 1 && grid[y + 1][x] && grid[y + 1][x].value === t.value) return true;
      }
    }
    return false;
  }

  function floatScore(x, y, n) {
    var el = document.createElement('div');
    el.className = 'float-score';
    el.textContent = '+' + n;
    el.style.setProperty('--tx', x);
    el.style.setProperty('--ty', y);
    tileLayer.appendChild(el);
    setTimeout(function () { el.remove(); }, 750);
  }

  function move(dir) {
    if (lock || gameOver) return;
    var v = VECTORS[dir];

    // 朝移动方向最前端的格子先处理
    var xs = [0, 1, 2, 3];
    var ys = [0, 1, 2, 3];
    if (v.x > 0) xs.reverse();
    if (v.y > 0) ys.reverse();

    var snap = saveSnapshot();
    var moved = false;
    var gained = 0;

    for (var yi = 0; yi < SIZE; yi++) {
      for (var xi = 0; xi < SIZE; xi++) {
        var y = ys[yi], x = xs[xi];
        var tile = grid[y][x];
        if (!tile) continue;

        // 找最远可达空位
        var cx = x, cy = y;
        var mergeTarget = null;
        for (;;) {
          var nx = cx + v.x, ny = cy + v.y;
          if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE) break;
          var occ = grid[ny][nx];
          if (!occ) { cx = nx; cy = ny; continue; }
          if (occ.value === tile.value && occ.mergedNow) {
            /* 本轮已合并过的块，不能再合并 */
          } else if (occ.value === tile.value) {
            mergeTarget = occ;
          }
          break;
        }

        if (mergeTarget) {
          // 合并：旧块滑过去，原地生成翻倍块
          grid[y][x] = null;
          setPos(tile.el, mergeTarget.x, mergeTarget.y);
          removeTile(tile);
          var merged = createTile(mergeTarget.x, mergeTarget.y, tile.value * 2, { pop: true });
          merged.mergedNow = true;
          removeTile(mergeTarget);
          gained += merged.value;
          floatScore(merged.x, merged.y, merged.value);
          if (merged.value === 2048 && !won) {
            won = true;
            winPending = true;
          }
          moved = true;
        } else if (cx !== x || cy !== y) {
          // 纯移动
          grid[y][x] = null;
          grid[cy][cx] = tile;
          tile.x = cx;
          tile.y = cy;
          setPos(tile.el, cx, cy);
          moved = true;
        }
      }
    }

    tiles.forEach(function (t) { delete t.mergedNow; });

    if (!moved) return;

    undoState = snap;
    refreshUndoBtn();

    if (gained) score += gained;
    updateScore(gained > 0);

    // 等滑动动画走完，再清理旧块、生成新块
    lock = true;
    lockTimer = setTimeout(function () {
      lock = false;
      flushRemovals();
      spawnTile();
      if (winPending) {
        winPending = false;
        setTimeout(showWin, 250);
      } else if (!canMove()) {
        gameOver = true;
        setTimeout(showLose, 300);
      }
    }, 130);
  }

  /* ---------- 撤销 / 新游戏 ---------- */

  function refreshUndoBtn() {
    undoBtn.disabled = !undoState;
  }

  function rebuildFrom(cells) {
    tiles.clear();
    flushRemovals();
    while (tileLayer.firstChild) tileLayer.removeChild(tileLayer.firstChild);
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        if (cells[y][x]) createTile(x, y, cells[y][x], { silent: true });
      }
    }
  }

  function undo() {
    if (lock || !undoState) return;
    var state = undoState;
    undoState = null;
    score = state.score;
    gameOver = false;
    hideOverlay();
    rebuildFrom(state.cells);
    updateScore(false);
    refreshUndoBtn();
  }

  function newGame() {
    clearTimeout(lockTimer);
    lock = false;
    winPending = false;
    gameOver = false;
    won = false;
    undoState = null;
    score = 0;
    grid = Array.from({ length: SIZE }, function () {
      return [null, null, null, null];
    });
    tiles.clear();
    flushRemovals();
    while (tileLayer.firstChild) tileLayer.removeChild(tileLayer.firstChild);
    hideOverlay();
    spawnTile();
    spawnTile();
    scoreEl.textContent = '0';
    refreshUndoBtn();
  }

  /* ---------- 输入：触屏 ---------- */

  var touchStart = null;

  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { touchStart = null; return; }
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  // 整页无滚动内容，拦截默认滚动/橡皮筋
  document.addEventListener('touchmove', function (e) {
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  });

  /* ---------- 输入：键盘 ---------- */

  var KEY_MAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  window.addEventListener('keydown', function (e) {
    var dir = KEY_MAP[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  /* ---------- 按钮 ---------- */

  undoBtn.addEventListener('click', undo);
  newBtn.addEventListener('click', newGame);
  overlayRestart.addEventListener('click', newGame);
  overlayContinue.addEventListener('click', hideOverlay);

  /* ---------- 启动 ---------- */

  best = parseInt(storageGet('game2048-best'), 10) || 0;
  bestEl.textContent = best;

  grid = Array.from({ length: SIZE }, function () {
    return [null, null, null, null];
  });
  tiles = new Map();
  spawnTile();
  spawnTile();
})();
</script>
</body>
</html>
