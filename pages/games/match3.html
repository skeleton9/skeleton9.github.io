<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1626">
<title>消消乐 · Match-3</title>
<style>
  :root {
    --bg: #0f1626;
    --bg2: #1a2438;
    --panel: #1f2a40;
    --accent: #4ecdc4;
    --accent2: #ffd166;
    --danger: #ef476f;
    --text: #e8eef5;
    --text-dim: #8a96ad;
    --gap: 5px;
    --board-size: min(92vw, 420px);
    --cell: calc((var(--board-size) - 8 * var(--gap)) / 7);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior: none; }

  body {
    background: radial-gradient(ellipse at 50% 0%, #1a2438 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", "Noto Sans SC", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    display: flex;
    justify-content: center;
    min-height: 100%;
  }

  .wrap {
    width: min(94vw, 460px);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: calc(14px + env(safe-area-inset-top)) 0 calc(16px + env(safe-area-inset-bottom));
  }

  /* ---------- 顶部 ---------- */
  header { padding: 0 4px 12px; position: relative; }

  .row-1 {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 10px;
  }

  .title-block { display: flex; flex-direction: column; }
  h1 { font-size: 24px; font-weight: 900; letter-spacing: -.5px; line-height: 1; }
  .subtitle { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .stats { display: flex; gap: 7px; }
  .stat {
    background: var(--bg2);
    border-radius: 8px;
    padding: 5px 12px 6px;
    text-align: center;
    display: flex;
    flex-direction: column;
    min-width: 62px;
  }
  .stat .label { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: var(--text-dim); }
  .stat .value { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .stat .value.warn { color: var(--danger); }
  .stat .value.bump { animation: bump .28s ease; }
  @keyframes bump { 50% { transform: scale(1.25); } }

  .progress-wrap {
    height: 6px;
    background: var(--bg2);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    border-radius: 3px;
    transition: width .4s ease;
  }
  .level-toast {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%) scale(.5);
    background: rgba(43, 58, 74, .94);
    color: #fff;
    padding: 12px 26px;
    border-radius: 16px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 1px;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
    transition: opacity .25s ease, transform .25s ease;
    z-index: 30;
  }
  .level-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ---------- 消除动效层 ---------- */
  .fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 15; overflow: visible; }
  .fx-float {
    position: absolute;
    transform: translate(-50%, -50%);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.35);
    white-space: nowrap;
    animation: floatUp .85s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, -30%) scale(.5); }
    18%  { opacity: 1; transform: translate(-50%, -58%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -135%) scale(1); }
  }
  .fx-bomb {
    position: absolute; transform: translate(-50%, -50%) scale(0);
    font-size: 44px; pointer-events: none; z-index: 18;
    filter: drop-shadow(0 0 10px rgba(255,150,40,.9));
    animation: bombPop .6s ease-out forwards;
  }
  @keyframes bombPop {
    0%   { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
    30%  { transform: translate(-50%, -50%) scale(1.5) rotate(8deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.9) rotate(0); opacity: 0; }
  }
  .fx-blast-h, .fx-blast-v {
    position: absolute; pointer-events: none; z-index: 16; border-radius: 8px;
    box-shadow: 0 0 18px rgba(255,150,40,.85);
    animation: blastFade .55s ease-out forwards;
  }
  .fx-blast-h {
    height: 16px; transform: translateY(-50%);
    background: linear-gradient(90deg, rgba(255,120,40,0), rgba(255,180,70,.95), rgba(255,120,40,0));
  }
  .fx-blast-v {
    width: 16px; transform: translateX(-50%);
    background: linear-gradient(180deg, rgba(255,120,40,0), rgba(255,180,70,.95), rgba(255,120,40,0));
  }
  @keyframes blastFade {
    0%   { opacity: 0; }
    25%  { opacity: 1; }
    100% { opacity: 0; }
  }
  /* ---------- 全屏爆炸清空（一次性消 7 个） ---------- */
  .fx-clear-flash {
    position: absolute; inset: 0; pointer-events: none; z-index: 17;
    background: radial-gradient(circle, rgba(255,255,255,.98), rgba(255,220,90,.72) 45%, rgba(255,140,40,.5) 75%, transparent);
    animation: clearFlash .55s ease-out forwards;
  }
  @keyframes clearFlash {
    0% { opacity: 0; } 22% { opacity: 1; } 100% { opacity: 0; }
  }
  .fx-clear-wave {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 0; height: 0; border-radius: 50%; pointer-events: none; z-index: 18;
    border: 8px solid rgba(255,230,110,.95);
    box-shadow: 0 0 30px rgba(255,180,60,.8), inset 0 0 24px rgba(255,200,80,.5);
    animation: clearWave .7s ease-out forwards;
  }
  @keyframes clearWave {
    0% { width: 0; height: 0; opacity: 1; transform: translate(-50%, -50%); }
    100% { width: var(--board-size); height: var(--board-size); opacity: 0; transform: translate(-50%, -50%); }
  }
  .fx-clear-boom {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0);
    font-size: 92px; pointer-events: none; z-index: 19;
    filter: drop-shadow(0 0 26px rgba(255,160,50,1));
    animation: clearBoom .65s cubic-bezier(.18,1.4,.4,1) forwards;
  }
  @keyframes clearBoom {
    0%   { transform: translate(-50%, -50%) scale(0) rotate(-18deg); opacity: 0; }
    35%  { transform: translate(-50%, -50%) scale(1.5) rotate(10deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.15) rotate(0); opacity: 1; }
  }
  .fx-clear-float {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    font-size: 26px; font-weight: 900; letter-spacing: 1px; color: #ffe14d;
    text-shadow: 0 3px 14px rgba(255,120,0,.6); pointer-events: none; z-index: 20;
    white-space: nowrap;
    animation: clearFloat .95s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes clearFloat {
    0%   { opacity: 0; transform: translate(-50%, -20%) scale(.5); }
    20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -150%) scale(1); }
  }
  .combo-flash {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(.3) rotate(-6deg);
    font-size: 30px; font-weight: 900; letter-spacing: 1px;
    color: #fff;
    background: linear-gradient(95deg, #ff8a3d, #ff3d77);
    padding: 8px 24px; border-radius: 20px;
    box-shadow: 0 8px 22px rgba(255,61,119,.4);
    opacity: 0; pointer-events: none; z-index: 25;
    text-shadow: 0 2px 6px rgba(0,0,0,.25);
    transition: opacity .18s ease, transform .18s cubic-bezier(.2,1.4,.4,1);
  }
  .combo-flash.show { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-6deg); }

  /* ---------- 棋盘 ---------- */
  .board-wrap {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 4px;
  }

  #board {
    position: relative;
    width: var(--board-size);
    height: var(--board-size);
    background: rgba(26, 36, 56, .5);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
    touch-action: none;
  }

  #tileLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .tile {
    position: absolute;
    width: var(--cell);
    height: var(--cell);
    left: var(--gap);
    top: var(--gap);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--cell) * .52);
    line-height: 1;
    transform: translate(
      calc((var(--cell) + var(--gap)) * var(--tx)),
      calc((var(--cell) + var(--gap)) * var(--ty))
    );
    transition: transform 180ms cubic-bezier(.34, 1.2, .64, 1);
    pointer-events: auto;
    cursor: pointer;
    will-change: transform;
  }

  .tile.spawn { animation: spawn .3s ease backwards; }
  @keyframes spawn {
    from { opacity: 0; scale: 0.3; }
    to   { opacity: 1; scale: 1; }
  }

  .tile.removing { animation: remove .3s ease forwards; z-index: 2; }
  @keyframes remove {
    to { opacity: 0; scale: 0; transform: translate(
      calc((var(--cell) + var(--gap)) * var(--tx)),
      calc((var(--cell) + var(--gap)) * var(--ty))
    ) scale(0) rotate(180deg); }
  }

  .tile.sel {
    box-shadow: 0 0 0 3px var(--accent), 0 0 16px rgba(78, 205, 196, .5);
    z-index: 3;
  }

  .tile.hint { animation: hintPulse .6s ease infinite alternate; }
  @keyframes hintPulse {
    to { box-shadow: 0 0 0 3px var(--accent2), 0 0 16px rgba(255, 209, 102, .5); }
  }

  /* 6 种图案配色 */
  .tile.t-0 { background: linear-gradient(145deg, #e74c3c, #c0392b); box-shadow: 0 2px 6px rgba(231, 76, 60, .3); }
  .tile.t-1 { background: linear-gradient(145deg, #f39c12, #d68910); box-shadow: 0 2px 6px rgba(243, 156, 18, .3); }
  .tile.t-2 { background: linear-gradient(145deg, #2ecc71, #27ae60); box-shadow: 0 2px 6px rgba(46, 204, 113, .3); }
  .tile.t-3 { background: linear-gradient(145deg, #3498db, #2980b9); box-shadow: 0 2px 6px rgba(52, 152, 219, .3); }
  .tile.t-4 { background: linear-gradient(145deg, #9b59b6, #8e44ad); box-shadow: 0 2px 6px rgba(155, 89, 182, .3); }
  .tile.t-5 { background: linear-gradient(145deg, #e91e63, #c2185b); box-shadow: 0 2px 6px rgba(233, 30, 99, .3); }

  /* ---------- 底部 ---------- */
  .controls {
    display: flex;
    gap: 7px;
    padding: 10px 4px 0;
  }
  .btn {
    flex: 1;
    border: none;
    border-radius: 8px;
    background: #1c2440;
    color: var(--text);
    font-size: 13px;
    font-weight: 800;
    font-family: inherit;
    padding: 10px 0;
    cursor: pointer;
    transition: transform .08s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(.95); }
  .btn:disabled { opacity: .4; }
  .btn.ghost { background: transparent; border: 1px solid #2c3a55; color: var(--text-dim); }
  .btn.mute-btn { flex: 0 0 46px; }

  /* ---------- 覆盖层 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 16, 28, .85);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
    z-index: 100;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { font-size: 26px; font-weight: 900; letter-spacing: -1px; margin-bottom: 4px; }
  .overlay .sub { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; }
  .stars { font-size: 38px; letter-spacing: 4px; margin: 10px 0; }
  .stars .on { color: #ffc83d; text-shadow: 0 2px 10px rgba(255,180,40,.5); }
  .stars .off { color: #c4c9d4; text-shadow: none; }

  .result-grid { display: flex; gap: 20px; margin: 6px 0 4px; }
  .result-cell { text-align: center; }
  .result-cell .n { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .result-cell .l { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .overlay .actions { width: 100%; max-width: 300px; margin-top: 16px; }
  .overlay .actions .btn { width: 100%; }
  .overlay .actions .ghost { margin-top: 8px; }

  /* 首页难度选择 */
  .home-title { font-size: 34px; font-weight: 900; letter-spacing: -1.5px; margin-bottom: 2px; }
  .diffs { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; margin-top: 20px; }
  .diffs .btn { width: 100%; padding: 14px 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .diffs .btn small { font-size: 11px; font-weight: 500; opacity: .75; }
  .home-note { font-size: 11px; color: var(--text-dim); margin-top: 18px; text-align: center; line-height: 1.6; }

  .foot {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    padding: 6px 8px 0;
  }

  @media (min-width: 480px) {
    :root { --board-size: 420px; }
  }
  @media (max-height: 660px) {
    :root { --board-size: min(82vw, 340px); }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row-1">
      <div class="title-block">
        <h1>消消乐</h1>
        <p class="subtitle" id="subtitle">交换相邻水果，三个同色消除</p>
      </div>
      <div class="stats">
        <div class="stat"><span class="label">分数</span><span class="value" id="score">0</span></div>
        <div class="stat"><span class="label">关卡</span><span class="value" id="level">第 1 / 6 关</span></div>
        <div class="stat"><span class="label">连消</span><span class="value" id="moves">0</span></div>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>
    <div class="level-toast" id="levelToast">第 2 关！</div>
  </header>

  <div class="board-wrap">
    <div id="board">
      <div id="tileLayer"></div>
      <div class="fx-layer" id="fxLayer"></div>
      <div class="combo-flash" id="comboFlash">连消 ×2</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn ghost" id="hintBtn">提示<span class="badge" id="hintCount">3</span></button>
    <button class="btn ghost" id="shuffleBtn">洗牌<span class="badge" id="shuffleCount">3</span></button>
    <button class="btn ghost home-btn" id="homeBtn">🏠 首页</button>
    <button class="btn" id="restartBtn">重新开始</button>
    <button class="btn ghost mute-btn" id="muteBtn">🔊</button>
  </div>

  <p class="foot" id="foot">不限步数 · 交换相邻水果消除 · 连锁得分翻倍 · 闯过 6 关（累计 28000 分）通关 · 星级看效率：通关 1★，≤124 次交换 2★，≤93 次 3★（连锁算 1 次）</p>
</div>

<!-- 结算 -->
<div class="overlay" id="resultOverlay">
  <h2 id="resultTitle">通关！</h2>
  <div class="stars" id="resultStars">★★★</div>
  <div class="result-grid">
    <div class="result-cell"><div class="n" id="rScore">0</div><div class="l">分数</div></div>
    <div class="result-cell"><div class="n" id="rCombo">0</div><div class="l">有效交换</div></div>
    <div class="result-cell"><div class="n" id="rMaxCombo">0</div><div class="l">最大连击</div></div>
  </div>
  <div class="actions">
    <button class="btn" id="againBtn">再来一局</button>
  </div>
</div>

<!-- 首页 / 难度选择 -->
<div class="overlay" id="homeOverlay">
  <h2 class="home-title">消消乐</h2>
  <p class="sub">选择难度开始</p>
  <div class="diffs">
    <button class="btn" data-diff="easy">简单<small>目标分 ×0.6</small></button>
    <button class="btn" data-diff="normal">普通<small>目标分 ×1.0（默认）</small></button>
    <button class="btn" data-diff="hard">困难<small>目标分 ×1.5</small></button>
  </div>
  <p class="home-note">闯过 6 关累计达标即通关<br>星级看效率：有效交换越少星级越高</p>
</div>

<script>
(function () {
  'use strict';

  var SIZE = 7;
  var TYPES = 6;
  var EMOJIS = ['🍎', '🍇', '🍊', '🍋', '🍉', '🍓'];
  var LEVEL_TARGETS_BASE = [2000, 5000, 9000, 14000, 20000, 28000]; // 普通难度累计目标分，共 6 关
  var DIFFS = { easy: 0.6, normal: 1.0, hard: 1.5 };                 // 难度缩放系数
  var LEVEL_TARGETS = LEVEL_TARGETS_BASE.slice();
  // 星级基准：正常每次消除 90 分；≤0.4×PAR 得 2 星，≤0.3×PAR 得 3 星（PAR = 通关分/90）
  var TARGET_TOTAL = LEVEL_TARGETS[LEVEL_TARGETS.length - 1];
  var PAR_MOVES = Math.round(TARGET_TOTAL / 90);
  var STAR2_MOVES = Math.round(PAR_MOVES * 0.4);
  var STAR3_MOVES = Math.round(PAR_MOVES * 0.3);
  var LEVEL = 0;
  var levelToastTimer = null;
  var HINTS = 5, SHUFFLES = 5;

  var grid;       // grid[y][x] -> tile 或 null（y=0 顶, y=SIZE-1 底）
  var tiles;      // id -> tile
  var tileId = 0;
  var score = 0;
  var hints = HINTS;
  var shuffles = SHUFFLES;
  var comboCount = 0;
  var maxCombo = 0;
  var moveCount = 0; // 累计有效交换次数（连锁按 1 次计）
  var finished = false;
  var busy = false;
  var selected = null;
  var muted = false;
  var audioCtx = null, masterGain = null;

  var board = document.getElementById('board');
  var tileLayer = document.getElementById('tileLayer');
  var scoreEl = document.getElementById('score');
  var movesEl = document.getElementById('moves');
  var progressEl = document.getElementById('progress');
  var hintBtn = document.getElementById('hintBtn');
  var shuffleBtn = document.getElementById('shuffleBtn');
  var restartBtn = document.getElementById('restartBtn');
  var muteBtn = document.getElementById('muteBtn');
  var hintCount = document.getElementById('hintCount');
  var shuffleCount = document.getElementById('shuffleCount');
  var resultOverlay = document.getElementById('resultOverlay');
  var resultTitle = document.getElementById('resultTitle');
  var resultStars = document.getElementById('resultStars');
  var rScore = document.getElementById('rScore');
  var rMoves = document.getElementById('rMoves');
  var rCombo = document.getElementById('rCombo');
  var rMaxCombo = document.getElementById('rMaxCombo');
  var homeOverlay = document.getElementById('homeOverlay');
  var homeBtn = document.getElementById('homeBtn');
  var footEl = document.getElementById('foot');
  var levelEl = document.getElementById('level');
  var levelToast = document.getElementById('levelToast');
  var fxLayer = document.getElementById('fxLayer');
  var comboFlash = document.getElementById('comboFlash');
  var againBtn = document.getElementById('againBtn');

  /* ---------- 音频 ---------- */
  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(audioCtx.destination);
    } catch (e) { audioCtx = null; }
  }
  function resumeAudio() { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }

  function tone(freq, dur, type, vol) {
    if (!audioCtx || muted) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(masterGain);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  function noiseBurst(dur, vol, freq) {
    if (!audioCtx || muted) return;
    var t = audioCtx.currentTime;
    var len = Math.floor(audioCtx.sampleRate * dur);
    var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    var bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = freq || 1200; bp.Q.value = 1;
    var g = audioCtx.createGain(); g.gain.value = vol;
    src.connect(bp).connect(g).connect(masterGain);
    src.start(t); src.stop(t + dur + 0.02);
  }

  function sndSwap() { tone(440, 0.08, 'triangle', 0.18); }
  function sndInvalid() { tone(180, 0.1, 'sawtooth', 0.14); }
  function sndMatch(combo) {
    var base = 523.25;
    var step = Math.min(combo - 1, 10);
    var f = base * Math.pow(2, step / 12);
    tone(f, 0.14, 'triangle', 0.24);
    tone(f * 1.5, 0.16, 'triangle', 0.18);
    noiseBurst(0.06, 0.1, 1500);
  }
  function sndHint() { tone(880, 0.1, 'sine', 0.2); setTimeout(function(){tone(1108,0.12,'sine',0.18);},80); }
  function sndShuffle() {
    if (!audioCtx || muted) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(880, t + 0.3);
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    o.connect(g).connect(masterGain); o.start(t); o.stop(t + 0.36);
  }
  function sndWin() { [523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,0.3,'triangle',0.26);},i*110);}); }
  function sndLose() { [440,349,261].forEach(function(f,i){setTimeout(function(){tone(f,0.3,'sine',0.2);},i*140);}); }
  function sndLevelUp() { [659,784,988,1319].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'triangle',0.24);},i*70);}); }
  function sndClear() {   // 全屏爆炸：低沉的冲击 + 高频爆裂
    if (!audioCtx || muted) return;
    tone(70, 0.5, 'sawtooth', 0.3);
    tone(50, 0.65, 'square', 0.25);
    noiseBurst(0.45, 0.35, 350);
    tone(1500, 0.25, 'triangle', 0.18, 0.12);
  }

  /* ---------- 工具 ---------- */
  function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

  function setPos(el, x, y) {
    el.style.setProperty('--tx', x);
    el.style.setProperty('--ty', y);
  }

  /* ---------- 创建 / 删除 ---------- */
  function createTile(x, y, type, opts) {
    opts = opts || {};
    var tile = { id: ++tileId, x: x, y: y, type: type };
    tiles.set(tile.id, tile);
    grid[y][x] = tile;

    var el = document.createElement('div');
    el.className = 'tile t-' + type + (opts.spawn ? ' spawn' : '');
    el.textContent = EMOJIS[type];
    setPos(el, x, y);
    if (opts.silent) el.classList.remove('spawn');
    tileLayer.appendChild(el);
    tile.el = el;
    return tile;
  }

  function removeTile(tile) {
    tiles.delete(tile.id);
    if (tile.el) tile.el.remove();
  }

  /* ---------- 棋盘初始化（无初始三连） ---------- */
  function randomType() { return Math.floor(Math.random() * TYPES); }

  function buildGrid() {
    grid = [];
    tiles = new Map();
    for (var y = 0; y < SIZE; y++) {
      grid.push(new Array(SIZE).fill(null));
    }
    for (var y2 = 0; y2 < SIZE; y2++) {
      for (var x = 0; x < SIZE; x++) {
        var t;
        do {
          t = randomType();
        } while (hasInitMatch(x, y2, t));
        createTile(x, y2, t, { silent: true });
      }
    }
  }

  function hasInitMatch(x, y, type) {
    // 检查放 type 在 (x,y) 是否会形成三连
    // 横向：左两格同
    if (x >= 2 && grid[y][x-1] && grid[y][x-1].type === type && grid[y][x-2] && grid[y][x-2].type === type) return true;
    // 纵向：上两格同
    if (y >= 2 && grid[y-1][x] && grid[y-1][x].type === type && grid[y-2][x] && grid[y-2][x].type === type) return true;
    return false;
  }

  /* ---------- 三连检测 ---------- */
  function findMatches() {
    var matched = {};
    // 横向
    for (var y = 0; y < SIZE; y++) {
      var runStart = 0;
      for (var x = 1; x <= SIZE; x++) {
        var same = x < SIZE && grid[y][x] && grid[y][runStart] && grid[y][x].type === grid[y][runStart].type;
        if (!same) {
          if (x - runStart >= 3) {
            for (var k = runStart; k < x; k++) matched[y * SIZE + k] = grid[y][k];
          }
          runStart = x;
        }
      }
    }
    // 纵向
    for (var x2 = 0; x2 < SIZE; x2++) {
      var runStart2 = 0;
      for (var y2 = 1; y2 <= SIZE; y2++) {
        var same2 = y2 < SIZE && grid[y2][x2] && grid[runStart2][x2] && grid[y2][x2].type === grid[runStart2][x2].type;
        if (!same2) {
          if (y2 - runStart2 >= 3) {
            for (var k2 = runStart2; k2 < y2; k2++) matched[k2 * SIZE + x2] = grid[k2][x2];
          }
          runStart2 = y2;
        }
      }
    }
    var list = Object.values(matched);
    return list.length ? list : null;
  }

  // 严格炸弹判定：找一行或一列连成 >=5 个的同色，返回其中心 {x,y}，无则 null
  function findBombCenter() {
    // 横向
    for (var y = 0; y < SIZE; y++) {
      var rs = 0;
      for (var x = 1; x <= SIZE; x++) {
        var same = x < SIZE && grid[y][x] && grid[y][rs] && grid[y][x].type === grid[y][rs].type;
        if (!same) {
          if (x - rs >= 5) return { x: Math.floor((rs + x - 1) / 2), y: y };
          rs = x;
        }
      }
    }
    // 纵向
    for (var x = 0; x < SIZE; x++) {
      var rs2 = 0;
      for (var y2 = 1; y2 <= SIZE; y2++) {
        var same2 = y2 < SIZE && grid[y2][x] && grid[rs2][x] && grid[y2][x].type === grid[rs2][x].type;
        if (!same2) {
          if (y2 - rs2 >= 5) return { x: x, y: Math.floor((rs2 + y2 - 1) / 2) };
          rs2 = y2;
        }
      }
    }
    return null;
  }

  // 全屏清空判定：是否存在横或竖方向整行/整列恰好 7 个同色（SIZE=7 时即整行/整列全同）
  function findSeven() {
    for (var y = 0; y < SIZE; y++) {
      var t0 = grid[y][0] && grid[y][0].type;
      if (t0 === null || t0 === undefined) continue;
      var ok = true;
      for (var x = 1; x < SIZE; x++) { if (!grid[y][x] || grid[y][x].type !== t0) { ok = false; break; } }
      if (ok) return true;
    }
    for (var x = 0; x < SIZE; x++) {
      var t1 = grid[0][x] && grid[0][x].type;
      if (t1 === null || t1 === undefined) continue;
      var ok2 = true;
      for (var y = 1; y < SIZE; y++) { if (!grid[y][x] || grid[y][x].type !== t1) { ok2 = false; break; } }
      if (ok2) return true;
    }
    return false;
  }

  /* ---------- 消除 + 下落 + 补充 ---------- */
  function resolveMatches(isChain) {
    busy = true;
    var matches = findMatches();
    if (!matches) {
      busy = false;
      // 不在此清零：连击数保留上一次结果，等到下一次消除启动（trySwap）时才置 0
      // 连锁真正结束，此时再检查胜负
      checkEnd();
      // 检查是否还有可消对，无则洗牌
      if (!finished && !findPossibleMove()) {
        if (tiles.size > 0) {
          setTimeout(function () { doShuffle(false); }, 200);
        }
      }
      return;
    }

    if (isChain) comboCount++; else comboCount = 1;
    if (comboCount > maxCombo) maxCombo = comboCount;
    sndMatch(comboCount);
    movesEl.textContent = comboCount;   // 顶部"连消"实时显示
    bump(movesEl);

    // 全屏爆炸清空：一次性正好消除 7 个一样的（整行/整列全同）→ 清空整个棋盘
    var clearAll = findSeven();
    var removeSet, bombCx = -1, bombCy = -1;
    if (clearAll) {
      removeSet = [];
      for (var yy = 0; yy < SIZE; yy++)
        for (var xx = 0; xx < SIZE; xx++)
          if (grid[yy][xx]) removeSet.push(grid[yy][xx]);
      sndClear();
    } else {
      // 严格模式：仅当一行或一列连成 5 个才出炸弹，炸掉爆心所在的整行与整列
      removeSet = matches;
      var bomb = findBombCenter();
      if (bomb) {
        var bcx = bomb.x, bcy = bomb.y;
        var seen = {};
        matches.forEach(function (t) { seen[t.y * SIZE + t.x] = true; });
        var extra = [];
        for (var yy = 0; yy < SIZE; yy++) {
          var t = grid[yy][bcx];
          if (t && !seen[yy * SIZE + bcx]) { extra.push(t); seen[yy * SIZE + bcx] = true; }
        }
        for (var xx = 0; xx < SIZE; xx++) {
          var t2 = grid[bcy][xx];
          if (t2 && !seen[bcy * SIZE + xx]) { extra.push(t2); seen[bcy * SIZE + xx] = true; }
        }
        removeSet = matches.concat(extra);
        bombCx = bcx; bombCy = bcy;
      }
    }

    var gained = removeSet.length * (clearAll ? 60 : 30) * comboCount;
    score += gained;
    scoreEl.textContent = score;
    bump(scoreEl);
    updateProgress();

    // 动效：分数浮字（多消更醒目）+ 连消数量闪现 + 炸弹爆炸 / 全屏清空
    if (!clearAll) spawnScoreFx(gained, removeSet, comboCount);
    if (comboCount >= 2) showCombo(comboCount);
    if (clearAll) spawnClearFx(gained);
    else if (bombCx >= 0) spawnBombFx(bombCx, bombCy, gained);

    // 消除动画
    removeSet.forEach(function (tile) {
      tile.el.classList.add('removing');
      grid[tile.y][tile.x] = null;
    });

    setTimeout(function () {
      removeSet.forEach(function (tile) { removeTile(tile); });
      dropAndFill();
    }, 300);
  }

  function dropAndFill() {
    // 下落：每列从底到顶，把非空格沉底
    for (var x = 0; x < SIZE; x++) {
      var writeY = SIZE - 1;
      for (var y = SIZE - 1; y >= 0; y--) {
        if (grid[y][x]) {
          if (y !== writeY) {
            var tile = grid[y][x];
            grid[writeY][x] = tile;
            grid[y][x] = null;
            tile.y = writeY;
            setPos(tile.el, x, writeY);
          }
          writeY--;
        }
      }
      // 顶部补充新格
      for (var y2 = writeY; y2 >= 0; y2--) {
        var t = randomType();
        createTile(x, y2, t, { spawn: true });
      }
    }

    // 等下落动画完成再检查连锁
    setTimeout(function () {
      resolveMatches(true);
    }, 220);
  }

  /* ---------- 交换 ---------- */
  function swapTiles(a, b) {
    // 交换 grid 和 tile 坐标
    grid[a.y][a.x] = b;
    grid[b.y][b.x] = a;
    var tx = a.x, ty = a.y;
    a.x = b.x; a.y = b.y;
    b.x = tx; b.y = ty;
    setPos(a.el, a.x, a.y);
    setPos(b.el, b.x, b.y);
  }

  function trySwap(a, b) {
    if (busy || finished) return;
    if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) !== 1) return; // 必须相邻

    busy = true;
    sndSwap();
    swapTiles(a, b);

    setTimeout(function () {
      var matches = findMatches();
      if (matches) {
        moveCount++;
        comboCount = 0;
        resolveMatches(true);
        // checkEnd 在 resolveMatches 连锁终止处调用
      } else {
        // 无匹配：换回去
        sndInvalid();
        setTimeout(function () {
          swapTiles(a, b);
          setTimeout(function () { busy = false; }, 200);
        }, 150);
      }
    }, 200);
  }

  /* ---------- 可消对检测（用于死局判断和提示） ---------- */
  function findPossibleMove() {
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        // 试与右邻交换
        if (x < SIZE - 1) {
          swapTest(x, y, x + 1, y);
          if (findMatches()) { swapTest(x, y, x + 1, y); return [x, y, x + 1, y]; }
          swapTest(x, y, x + 1, y);
        }
        // 试与下邻交换
        if (y < SIZE - 1) {
          swapTest(x, y, x, y + 1);
          if (findMatches()) { swapTest(x, y, x, y + 1); return [x, y, x, y + 1]; }
          swapTest(x, y, x, y + 1);
        }
      }
    }
    return null;
  }

  function swapTest(x1, y1, x2, y2) {
    var a = grid[y1][x1], b = grid[y2][x2];
    grid[y1][x1] = b; grid[y2][x2] = a;
  }

  /* ---------- 提示 ---------- */
  function useHint() {
    if (busy || finished || hints <= 0) return;
    var move = findPossibleMove();
    if (!move) return;
    hints--;
    hintCount.textContent = hints;
    hintBtn.disabled = hints === 0;
    sndHint();
    var t1 = grid[move[1]][move[0]];
    var t2 = grid[move[3]][move[2]];
    t1.el.classList.add('hint');
    t2.el.classList.add('hint');
    setTimeout(function () {
      t1.el.classList.remove('hint');
      t2.el.classList.remove('hint');
    }, 2500);
  }

  /* ---------- 洗牌 ---------- */
  function doShuffle(manual) {
    if (busy || finished) return;
    if (manual && shuffles <= 0) return;
    if (manual) {
      shuffles--;
      shuffleCount.textContent = shuffles;
      shuffleBtn.disabled = shuffles === 0;
    }
    sndShuffle();

    // 收集所有 type，重新分配（保证无初始三连且有可消对）
    var types = [];
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        if (grid[y][x]) types.push(grid[y][x].type);
      }
    }

    var guard = 0;
    do {
      shuffle(types);
      var idx = 0;
      for (var y2 = 0; y2 < SIZE; y2++) {
        for (var x2 = 0; x2 < SIZE; x2++) {
          if (grid[y2][x2]) {
            var t = types[idx++];
            grid[y2][x2].type = t;
            grid[y2][x2].el.textContent = EMOJIS[t];
            grid[y2][x2].el.className = 'tile t-' + t;
            setPos(grid[y2][x2].el, x2, y2);
          }
        }
      }
      guard++;
    } while ((findMatches() || !findPossibleMove()) && guard < 100);

    if (selected) {
      selected.el.classList.remove('sel');
      selected = null;
    }
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ---------- 进度 / 结束（多关卡递进） ---------- */
  function curTarget() { return LEVEL_TARGETS[LEVEL]; }
  function prevTarget() { return LEVEL === 0 ? 0 : LEVEL_TARGETS[LEVEL - 1]; }

  function updateProgress() {
    var cur = curTarget(), prev = prevTarget();
    var pct = Math.max(0, Math.min(100, (score - prev) / (cur - prev) * 100));
    progressEl.style.width = pct + '%';
    levelEl.textContent = '第 ' + (LEVEL + 1) + ' / ' + LEVEL_TARGETS.length + ' 关';
  }

  function showLevelBanner() {
    levelToast.textContent = '第 ' + (LEVEL + 1) + ' 关！';
    levelToast.classList.add('show');
    clearTimeout(levelToastTimer);
    levelToastTimer = setTimeout(function () { levelToast.classList.remove('show'); }, 900);
  }

  /* ---------- 消除动效：分数浮字 + 连消闪现 ---------- */
  function spawnScoreFx(gained, matches, combo) {
    if (!matches || !matches.length) return;
    // 计算消除中心（棋盘内相对坐标）
    var boardRect = board.getBoundingClientRect();
    var sx = 0, sy = 0, n = 0;
    matches.forEach(function (t) {
      if (!t.el) return;
      var r = t.el.getBoundingClientRect();
      sx += r.left + r.width / 2; sy += r.top + r.height / 2; n++;
    });
    if (!n) return;
    var cx = (sx / n - boardRect.left), cy = (sy / n - boardRect.top);
    var big = matches.length >= 4;            // 多消：一次消掉 4 个及以上
    var el = document.createElement('div');
    el.className = 'fx-float';
    el.textContent = '+' + gained;
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.fontSize = (big ? 30 : 22) + 'px';
    if (big) {
      el.style.color = '#ffe14d';
      el.style.textShadow = '0 2px 10px rgba(255,180,0,.55)';
      el.textContent = '多消! +' + gained;
    }
    if (combo >= 2) { el.style.fontSize = (parseInt(el.style.fontSize) + 4) + 'px'; }
    fxLayer.appendChild(el);
    setTimeout(function () { el.remove(); }, 900);
  }

  // 炸弹爆炸：💥 + 横纵两条闪光条，覆盖整行整列
  function spawnBombFx(cx, cy, gained) {
    var boardRect = board.getBoundingClientRect();
    var cw = boardRect.width / SIZE, ch = boardRect.height / SIZE;
    var px = (cx + 0.5) * cw, py = (cy + 0.5) * ch;

    var bomb = document.createElement('div');
    bomb.className = 'fx-bomb';
    bomb.textContent = '💥';
    bomb.style.left = px + 'px';
    bomb.style.top = py + 'px';
    fxLayer.appendChild(bomb);

    var hLine = document.createElement('div');
    hLine.className = 'fx-blast-h';
    hLine.style.left = '0';
    hLine.style.top = py + 'px';
    hLine.style.width = boardRect.width + 'px';
    fxLayer.appendChild(hLine);

    var vLine = document.createElement('div');
    vLine.className = 'fx-blast-v';
    vLine.style.left = px + 'px';
    vLine.style.top = '0';
    vLine.style.height = boardRect.height + 'px';
    fxLayer.appendChild(vLine);

    setTimeout(function () { bomb.remove(); hLine.remove(); vLine.remove(); }, 600);
  }

  // 全屏爆炸清空：中心大 💥 + 全盘闪光 + 冲击波扩散 + 随机小爆点 + 分数大字
  function spawnClearFx(gained) {
    var boardRect = board.getBoundingClientRect();

    var flash = document.createElement('div'); flash.className = 'fx-clear-flash';
    fxLayer.appendChild(flash);

    var wave = document.createElement('div'); wave.className = 'fx-clear-wave';
    fxLayer.appendChild(wave);

    var boom = document.createElement('div'); boom.className = 'fx-clear-boom';
    boom.textContent = '💥';
    fxLayer.appendChild(boom);

    var txt = document.createElement('div'); txt.className = 'fx-clear-float';
    txt.textContent = '全屏清空! +' + gained;
    fxLayer.appendChild(txt);

    // 随机小爆点，铺满爆炸氛围
    for (var i = 0; i < 7; i++) {
      (function () {
        var b = document.createElement('div');
        b.className = 'fx-bomb';
        b.textContent = '💥';
        b.style.left = (Math.random() * boardRect.width) + 'px';
        b.style.top = (Math.random() * boardRect.height) + 'px';
        b.style.fontSize = (18 + Math.random() * 26) + 'px';
        fxLayer.appendChild(b);
        setTimeout(function () { b.remove(); }, 700);
      })();
    }

    setTimeout(function () { flash.remove(); wave.remove(); boom.remove(); txt.remove(); }, 1100);
  }

  var comboTimer = null;
  function showCombo(n) {
    comboFlash.textContent = '连消 ×' + n + '!';
    comboFlash.classList.add('show');
    clearTimeout(comboTimer);
    comboTimer = setTimeout(function () { comboFlash.classList.remove('show'); }, 650);
  }

  function checkEnd() {
    if (finished) return;
    // 一次性可能跨多关（大连锁），循环推进到当前关卡
    var advanced = false;
    while (LEVEL < LEVEL_TARGETS.length - 1 && score >= LEVEL_TARGETS[LEVEL]) {
      LEVEL++; advanced = true;
    }
    updateProgress();
    if (advanced) { sndLevelUp(); showLevelBanner(); }
    // 到达最后一关目标即通关
    if (LEVEL === LEVEL_TARGETS.length - 1 && score >= LEVEL_TARGETS[LEVEL]) {
      finish(true);
    }
  }

  function finish(win) {
    if (finished) return;
    finished = true;
    if (win) sndWin(); else sndLose();
    // 星级挂钩效率：通关 1 星；有效交换 ≤ STAR2 得 2 星；≤ STAR3 得 3 星（连锁按 1 次计）
    var stars = win ? (moveCount <= STAR3_MOVES ? 3 : moveCount <= STAR2_MOVES ? 2 : 1) : 0;
    resultTitle.textContent = win
      ? (stars === 3 ? '完美通关！' : stars === 2 ? '效率高手！' : '通关！')
      : '游戏结束';
    resultStars.innerHTML = Array(stars).fill('<span class="on">★</span>').join('') +
      Array(3 - stars).fill('<span class="off">★</span>').join('');
    rScore.textContent = score;
    rCombo.textContent = moveCount;
    rMaxCombo.textContent = maxCombo;
    setTimeout(function () { resultOverlay.classList.add('show'); }, 400);
  }

  /* ---------- 输入 ---------- */
  function tileFromEl(el) {
    for (var t of tiles.values()) {
      if (t.el === el) return t;
    }
    return null;
  }

  // 点击选择 + 交换
  tileLayer.addEventListener('click', function (e) {
    if (busy || finished) return;
    var el = e.target.closest('.tile');
    if (!el) return;
    var tile = tileFromEl(el);
    if (!tile) return;

    if (!selected) {
      selected = tile;
      el.classList.add('sel');
      return;
    }

    if (selected === tile) {
      el.classList.remove('sel');
      selected = null;
      return;
    }

    if (Math.abs(selected.x - tile.x) + Math.abs(selected.y - tile.y) === 1) {
      selected.el.classList.remove('sel');
      var a = selected;
      selected = null;
      trySwap(a, tile);
    } else {
      selected.el.classList.remove('sel');
      selected = tile;
      el.classList.add('sel');
    }
  });

  // 滑动交换
  var touchStart = null;
  board.addEventListener('pointerdown', function (e) {
    if (busy || finished) return;
    var el = e.target.closest('.tile');
    if (!el) return;
    touchStart = { x: e.clientX, y: e.clientY, tile: tileFromEl(el) };
  });

  board.addEventListener('pointerup', function (e) {
    if (!touchStart || !touchStart.tile) return;
    var dx = e.clientX - touchStart.x;
    var dy = e.clientY - touchStart.y;
    var tile = touchStart.tile;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return; // 短按当点击

    var dir;
    if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
    else dir = dy > 0 ? 'down' : 'up';

    var nx = tile.x, ny = tile.y;
    if (dir === 'right') nx++; else if (dir === 'left') nx--;
    else if (dir === 'down') ny++; else ny--;

    if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE) return;
    var other = grid[ny][nx];
    if (!other) return;
    if (selected) { selected.el.classList.remove('sel'); selected = null; }
    trySwap(tile, other);
  });

  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  /* ---------- 按钮 ---------- */
  hintBtn.addEventListener('click', useHint);
  shuffleBtn.addEventListener('click', function () { doShuffle(true); });
  restartBtn.addEventListener('click', newGame);
  againBtn.addEventListener('click', newGame);
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (!muted) { initAudio(); resumeAudio(); sndSwap(); }
  });

  // 难度：缩放 6 关目标分（关卡/星级体系随之联动）
  function applyDifficulty(scale) {
    LEVEL_TARGETS = LEVEL_TARGETS_BASE.map(function (v) { return Math.round(v * scale); });
    TARGET_TOTAL = LEVEL_TARGETS[LEVEL_TARGETS.length - 1];
    PAR_MOVES = Math.round(TARGET_TOTAL / 90);
    STAR2_MOVES = Math.round(PAR_MOVES * 0.4);
    STAR3_MOVES = Math.round(PAR_MOVES * 0.3);
    updateFootText();
  }
  function updateFootText() {
    footEl.textContent = '不限步数 · 交换相邻水果消除 · 连锁得分翻倍 · 闯过 6 关（累计 ' +
      TARGET_TOTAL + ' 分）通关 · 星级看效率：通关 1★，≤' + STAR2_MOVES +
      ' 次交换 2★，≤' + STAR3_MOVES + ' 次 3★（连锁算 1 次）';
  }

  // 首页：返回难度选择
  homeBtn.addEventListener('click', function () {
    finished = true;
    busy = false;
    selected = null;
    resultOverlay.classList.remove('show');
    homeOverlay.classList.add('show');
  });
  // 选择难度后开局
  homeOverlay.querySelectorAll('[data-diff]').forEach(function (b) {
    b.addEventListener('click', function () {
      applyDifficulty(DIFFS[b.dataset.diff]);
      homeOverlay.classList.remove('show');
      newGame();
    });
  });

  document.addEventListener('pointerdown', function onceInit() {
    initAudio(); resumeAudio();
    document.removeEventListener('pointerdown', onceInit);
  });

  /* ---------- 新游戏 ---------- */
  function newGame() {
    initAudio(); resumeAudio();
    busy = false;
    finished = false;
    score = 0;
    LEVEL = 0;
    hints = HINTS;
    shuffles = SHUFFLES;
    comboCount = 0;
    maxCombo = 0;
    moveCount = 0;
    selected = null;
    scoreEl.textContent = '0';
    movesEl.textContent = '0';
    hintCount.textContent = HINTS;
    shuffleCount.textContent = SHUFFLES;
    hintBtn.disabled = false;
    shuffleBtn.disabled = false;
    updateProgress();
    resultOverlay.classList.remove('show');

    // 清 DOM
    while (tileLayer.firstChild) tileLayer.removeChild(tileLayer.firstChild);

    buildGrid();
  }

  applyDifficulty(DIFFS.normal);
  homeOverlay.classList.add('show');
})();
</script>
</body>
</html>
