</head><body><header><a class="brand" href="./"><span class="logo">▦</span><div>方块宠物屋<small>POCKET PAWS</small></div></a><nav><button class="active" id="play">游乐室</button><button id="collection">宠物图鉴</button><button id="help">玩法指南 ↗</button></nav><span class="tiny">慢慢来，每一格都有归属。</span></header><main><aside><div class="eyebrow">A LITTLE PUZZLE, A LITTLE JOY</div><h1>给小可爱们，<br>圈一个家<span>。</span></h1><p class="intro">一串数字，一点巧思。<br>把零散的方格，变成满满当当的温暖。</p><div class="hero-pets"><div class="pet peach"><i></i><b>ω</b></div><div class="pet sage"><i></i><b>ᴗ</b></div><span class="spark">✧</span></div><div class="note"><span>今日份的小确幸</span><p>不用赶时间，也不必追求完美。<br>小家伙们会一直等着你。</p><div>— 来自宠物屋的一封小纸条</div></div><footer>手指轻轻一划，快乐刚刚好。</footer></aside><section class="game"><div class="game-head"><div><span class="eyebrow" id="chapter">CHAPTER 01 · 初次见面</span><h2 id="title">小小的新家</h2></div><button id="sound" aria-label="关闭音效">♫</button></div><div class="stats"><span id="level-label"></span><span id="count"></span></div><div id="board" aria-label="拼图棋盘"></div><p id="message" role="status">从一个角拖到另一个角，为宠物圈一个家。</p><div class="actions"><button id="undo">↶ <span>撤销</span></button><button id="reset">⟳ <span>重新开始</span></button><button id="hint">✧ <span>小提示</span></button></div><div class="progress"><div id="bar"></div></div><div class="bottom"><span>每个数字，都是一只等待入住的小可爱</span><span id="percent">0%</span></div></section><section class="levels"><div class="levels-head"><h3>一段小小的冒险 <span>30 个推理挑战</span></h3><span id="completed">0 / 30 完成</span></div><div id="level-list"></div></section></main><dialog id="dialog"><button id="close" aria-label="关闭">×</button><div id="modal"></div></dialog><script src="app.js"></script></body></html>
