<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>彩序 · 彩球实验室</title><link rel="stylesheet" href="style.css?v=20261102q"><link rel="stylesheet" href="theme.css?v=20261102q"></head><body><header><a class="brand" href="./" aria-label="彩序"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i></span></a><div class="header-right"><button id="sound" aria-label="关闭声音" aria-pressed="true">♫</button><button id="help" aria-label="游戏规则">?</button></div></header><main><section class="game"><div class="game-top"><h2>关卡 <span id="level">01</span></h2><div class="stats"><div aria-label="移动步数"><i aria-hidden="true">↟</i><strong id="moves">0</strong></div><div aria-label="游戏用时"><i aria-hidden="true">◷</i><strong id="time">00:00</strong></div><div aria-label="完成进度"><i aria-hidden="true">✓</i><strong id="progress">0/3</strong></div></div></div><div id="board" aria-label="游戏棋盘"></div><div id="message" role="status" aria-live="polite"></div><div class="actions"><button id="undo">↶ <span>撤销</span></button><button id="hint">✧ <span>提示</span></button><button id="restart">⟳ <span>重开</span></button><button id="next" class="primary">下一关 <span>→</span></button></div></section><aside><div class="difficulty" aria-label="选择难度"><button data-mode="0" class="active"><span class="mode-icon" aria-hidden="true">◔</span><strong>轻松</strong></button><button data-mode="1"><span class="mode-icon" aria-hidden="true">◑</span><strong>标准</strong></button><button data-mode="2"><span class="mode-icon" aria-hidden="true">●</span><strong>挑战</strong></button></div></aside></main><dialog id="dialog"><button id="close" aria-label="关闭">×</button><div id="dialogContent"></div><button id="dialogAction" class="primary">继续游戏</button></dialog><script src="game.js?v=20261102q"></script><script src="app.js?v=20261102q"></script></body></html>
